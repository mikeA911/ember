# Ember CI on GitLab (docs/architecture-decisions/ADR-0003-source-hosting-and-zadara-deployment.md).
#
# Every job here is something a contributor can run locally: lint, typecheck,
# unit tests and a production build. None of them needs a database or AI
# provider keys -- the RLS suites read migration files, and `next build`
# succeeds without NEXT_PUBLIC_SUPABASE_URL (see next.config.ts).
#
# Deploy jobs are added when the Zadara app VM exists (docs/guides/moving-to-gitlab-and-zadara.md,
# Phase 3); until then Vercel deploys from its own GitLab integration.

image: node:22-bookworm-slim

stages:
  - check
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  # sharp and Playwright are not needed for these jobs.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

lint:
  stage: check
  script:
    - npm run lint

typecheck:
  stage: check
  script:
    - npm run typecheck

test:
  stage: check
  script:
    - npm test

build:
  stage: build
  needs: [lint, typecheck, test]
  script:
    - npx next build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .next/cache/
